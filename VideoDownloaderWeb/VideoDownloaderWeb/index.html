<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1f24; --muted:#6a7280; --line:#d9dde3; --accent:#2f6fed; --bad:#c62828; --good:#1b7f3b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2025; --text:#e8eaee; --muted:#9aa2af; --line:#2f343c; --accent:#5b8cff; --bad:#ff6b6b; --good:#4cc26f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:640px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; font-weight:600; font-size:.85rem; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input[type=url], select { width:100%; padding:10px 12px; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .check { display:flex; gap:8px; align-items:center; margin-top:14px; font-size:.9rem; }
  .row { display:flex; gap:8px; margin-top:18px; }
  button, .btn { font:inherit; font-weight:600; padding:10px 18px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; text-decoration:none; display:inline-block; }
  button.secondary { background:transparent; color:var(--text); border-color:var(--line); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .bar { height:10px; background:var(--bg); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:20px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  #status { margin-top:10px; font-size:.9rem; color:var(--muted); min-height:1.4em; word-break:break-word; }
  #status.error { color:var(--bad); } #status.ok { color:var(--good); }
  #result { margin-top:14px; display:none; }
  footer { color:var(--muted); font-size:.78rem; margin-top:18px; }
</style>
</head>
<body>
<main>
  <h1>Video Downloader</h1>
  <p class="sub">Paste a link, pick a quality, download.</p>
  <div class="card">
    <label for="url">Video URL</label>
    <input id="url" type="url" placeholder="https://..." autofocus>

    <label for="fmt">Quality</label>
    <select id="fmt">
      <option value="best">Best quality (MP4)</option>
      <option value="1080">1080p max (MP4)</option>
      <option value="720">720p max (MP4)</option>
      <option value="480">480p max (MP4)</option>
      <option value="mp3">Audio only (MP3)</option>
    </select>

    <div class="check">
      <input id="playlist" type="checkbox">
      <label for="playlist" style="margin:0;font-weight:400">If the link is a playlist, download the whole playlist (as a .zip)</label>
    </div>

    <div class="row">
      <button id="go">Download</button>
      <button id="cancel" class="secondary" disabled>Cancel</button>
    </div>

    <div class="bar"><div id="fill"></div></div>
    <div id="status">Ready</div>
    <div id="result"><a id="save" class="btn" href="#">Save file</a></div>
  </div>
  <footer>Only download content you own, that is public domain / Creative Commons, or that the owner has given you permission to download.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
let jobId = null, timer = null;

function setStatus(text, cls) { const s = $("status"); s.textContent = text; s.className = cls || ""; }
function setBusy(b) { $("go").disabled = b; $("cancel").disabled = !b; }

async function start() {
  const url = $("url").value.trim();
  if (!url) { setStatus("Please paste a video URL first.", "error"); return; }
  $("result").style.display = "none";
  $("fill").style.width = "0%";
  setStatus("Starting...");
  setBusy(true);
  try {
    const r = await fetch("/api/download", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({url, format: $("fmt").value, playlist: $("playlist").checked})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Request failed.");
    jobId = d.id;
    timer = setInterval(poll, 700);
  } catch (e) { setStatus(e.message, "error"); setBusy(false); }
}

async function poll() {
  try {
    const r = await fetch("/api/status/" + jobId);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    $("fill").style.width = d.pct + "%";
    if (d.status === "done") {
      clearInterval(timer); setBusy(false);
      setStatus("Done: " + d.name, "ok");
      $("save").href = "/api/file/" + jobId;
      $("result").style.display = "block";
    } else if (d.status === "error") {
      clearInterval(timer); setBusy(false); setStatus("Failed: " + d.message, "error");
    } else if (d.status === "cancelled") {
      clearInterval(timer); setBusy(false); setStatus("Cancelled.");
    } else { setStatus(d.message); }
  } catch (e) { clearInterval(timer); setBusy(false); setStatus(e.message, "error"); }
}

async function cancel() {
  if (jobId) { await fetch("/api/cancel/" + jobId, {method: "POST"}); setStatus("Cancelling..."); }
}

$("go").onclick = start;
$("cancel").onclick = cancel;
$("url").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
</script>
</body>
</html>
